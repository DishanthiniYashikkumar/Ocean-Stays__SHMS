<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a2140" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#08111e" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-title" content="Ocean Stays" />
    <meta
      name="description"
      content="Ocean Stays — where the ocean meets exceptional hospitality. Luxury coastal rooms, suites and villas on Sri Lanka's southern coast."
    />

    <!-- Display serif for branding + Inter for UI. Both degrade to solid
         system fallbacks (Georgia / Segoe UI) if the CDN is unreachable. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap"
      rel="stylesheet"
    />

    <!-- Apply the saved theme before first paint (no light flash in dark mode).
         Mirrors context/ThemeProvider.jsx; storage may be blocked, so guarded. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("shms.theme");
          if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>

    <title>Ocean Stays · Where the Ocean Meets Exceptional Hospitality</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
